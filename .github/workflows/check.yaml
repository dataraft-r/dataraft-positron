name: Check extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - run: xvfb-run -a npm run test:host
        timeout-minutes: 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: webview-failure
          path: .vscode-test/host-webview
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dataraft-positron-vsix
          path: dataraft-positron.vsix
  integration:
    name: Persistent R session integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
          cache: npm
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.5.1"
          use-public-rspm: false
      - run: npm ci --ignore-scripts
      - name: Install immutable R integration dependencies
        run: Rscript test/setup-r.R
      - name: Exercise real R transport and persistent session without skips
        run: npm run test:integration
  positron:
    name: Positron 2026.09.1-2 / R 4.5.1 user flows
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DATARAFT_EXPECT_R_VERSION: "4.5.1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
          cache: npm
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.5.1"
          use-public-rspm: false
      - run: npm ci --ignore-scripts
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libasound2t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libnss3 libgbm1 libxkbfile1
      - name: Install immutable R integration dependencies
        run: Rscript test/setup-r.R
      - name: Verify and extract the official pinned Positron desktop
        run: node test/install-positron.cjs
      - name: Exercise native Positron and its real R runtime
        run: xvfb-run -a npm run test:positron
        timeout-minutes: 15
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: positron-runtime-evidence
          path: .vscode-test/positron-artifacts
          include-hidden-files: true
          if-no-files-found: warn
