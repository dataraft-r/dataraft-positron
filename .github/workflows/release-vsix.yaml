name: Release VSIX
on:
  workflow_run:
    workflows: ["Check extension"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: dataraft-vsix-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Select versioned release or unique development preview
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          short_sha=${SOURCE_SHA:0:12}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -f "RELEASE_NOTES_v$version.md" ]] && ! gh release view "v$version" >/dev/null 2>&1; then
            kind=versioned
            tag="v$version"
            asset="dataraft-positron-$version.vsix"
          else
            kind=development
            tag="dev-$short_sha"
            asset="dataraft-positron-$version-dev-$short_sha.vsix"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify exact VSIX
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test
          npm run package
          node -e 'const cp=require("child_process");const p=JSON.parse(cp.execFileSync("unzip",["-p","dataraft-positron.vsix","extension/package.json"],{encoding:"utf8"}));if(p.name!=="dataraft-positron"||p.version!==process.env.VERSION)process.exit(1)'
          mv dataraft-positron.vsix "$ASSET"
          sha256sum "$ASSET" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish pre-release with checksum
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          KIND: ${{ steps.release.outputs.kind }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          if [[ "$KIND" == versioned ]]; then
            cp "RELEASE_NOTES_v$VERSION.md" release-notes.txt
            title="DataRaft for Positron v$VERSION"
          else
            title="DataRaft for Positron development $TAG"
            printf 'Automatic development VSIX for commit `%s`.\n\nInstall `%s` with **Extensions: Install from VSIX** in Positron. The embedded extension version is `%s`; the commit in the asset name identifies this build. This preview is not a separately numbered stable version.\n' "$SOURCE_SHA" "$ASSET" "$VERSION" > release-notes.txt
          fi
          printf '\nBuilt from commit `%s` after [successful CI](%s).\n\nSHA-256:\n```text\n' "$SOURCE_SHA" "$CHECK_URL" >> release-notes.txt
          cat SHA256SUMS.txt >> release-notes.txt
          printf '```\n' >> release-notes.txt
          gh release create "$TAG" "$ASSET" SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "$title" \
            --notes-file release-notes.txt --prerelease
