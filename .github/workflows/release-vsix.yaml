name: Release VSIX
on:
  workflow_run:
    workflows: ["Check extension"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: dataraft-vsix-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Select a version with release notes that is not published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if [[ -f "RELEASE_NOTES_v$version.md" ]] && ! gh release view "v$version" >/dev/null 2>&1; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify exact VSIX
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.number }}
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test
          npm run package
          node -e 'const fs=require("fs"),cp=require("child_process");const p=JSON.parse(cp.execFileSync("unzip",["-p","dataraft-positron.vsix","extension/package.json"],{encoding:"utf8"}));if(p.name!=="dataraft-positron"||p.version!==process.env.VERSION)process.exit(1)'
          mv dataraft-positron.vsix "dataraft-positron-$VERSION.vsix"
          sha256sum "dataraft-positron-$VERSION.vsix" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish pre-release with checksum
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          cp "RELEASE_NOTES_v$VERSION.md" release-notes.txt
          printf '\nBuilt from commit `%s` after [successful CI](%s).\n\nSHA-256:\n```text\n' "$SOURCE_SHA" "$CHECK_URL" >> release-notes.txt
          cat SHA256SUMS.txt >> release-notes.txt
          printf '```\n' >> release-notes.txt
          gh release create "v$VERSION" "dataraft-positron-$VERSION.vsix" SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "DataRaft for Positron v$VERSION" \
            --notes-file release-notes.txt --prerelease
